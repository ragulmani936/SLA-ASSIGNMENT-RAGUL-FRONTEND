<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bootstrap 3 Column Layout</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <div class="container mt-5">

    <!-- Heading -->
    <h1 class="display-4 text-center mb-4">Bootstrap Grid Example</h1>

    <div class="row">

      <!-- Column 1: Full width on mobile -->
      <div class="col-12 col-md-4 p-4 mb-3 bg-primary text-white text-center">
        <h2 class="display-6">Column 1</h2>
        <p>This column is full width on mobile.</p>
      </div>

      <!-- Column 2 -->
      <div class="col-12 col-md-4 p-4 mb-3 bg-success text-white text-center">
        <h2 class="display-6">Column 2</h2>
        <p>Stacks on mobile, equal width on desktop.</p>
      </div>

      <!-- Column 3 -->
      <div class="col-12 col-md-4 p-4 mb-3 bg-warning text-dark text-center">
        <h2 class="display-6">Column 3</h2>
        <p>Uses Bootstrap utility classes.</p>
      </div>

    </div>
  </div>

</body>
</html>
