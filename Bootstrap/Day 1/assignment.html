<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile Card</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container mt-5">

    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">

        <!-- Profile Card -->
        <div class="card shadow p-4 bg-white">

          <div class="row align-items-center">

            <!-- Profile Image -->
            <div class="col-12 col-md-4 text-center mb-3 mb-md-0">
              <img src="https://via.placeholder.com/150"
                   class="img-fluid rounded-circle border"
                   alt="Profile Image">
            </div>

            <!-- Profile Details -->
            <div class="col-12 col-md-8 text-center text-md-start">
              <h2 class="display-6 text-primary">Ragul M</h2>
              <p class="text-muted mb-1">AI & Data Science Student</p>
              <p class="fw-light">
                Passionate about front-end development, Python, and building
                intelligent web applications.
              </p>

              <span class="badge bg-success me-2">Python</span>
              <span class="badge bg-info text-dark me-2">React</span>
              <span class="badge bg-warning text-dark">AI</span>
            </div>

          </div>

        </div>
        <!-- End Card -->

      </div>
    </div>

  </div>

</body>
</html>
