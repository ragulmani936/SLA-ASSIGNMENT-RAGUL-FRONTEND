<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bootstrap Components</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

      <!-- Brand -->
      <a class="navbar-brand" href="#">MyProfile</a>

      <!-- Toggle button -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Menu items -->
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link active" href="#">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">About</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Contact</a>
          </li>
        </ul>
      </div>

    </div>
  </nav>

  <!-- BUTTONS -->
  <div class="container text-center mt-4">
    <button class="btn btn-primary me-2">Primary Button</button>
    <button class="btn btn-success">Success Button</button>
  </div>

  <!-- CARD (Centered using Flex) -->
  <div class="container mt-5">
    <div class="d-flex justify-content-center">

      <div class="card shadow" style="width: 18rem;">
        <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Card Image">

        <div class="card-body text-center">
          <h5 class="card-title">Profile Card</h5>
          <p class="card-text">
            This is a simple Bootstrap card with image, text, and button.
          </p>
          <a href="#" class="btn btn-primary">View Profile</a>
        </div>
      </div>

    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
