<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Responsive Bootstrap Website</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- ================= NAVBAR ================= -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#">MyShop</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#navbarMenu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarMenu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Products</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Login</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- ================= HERO SECTION ================= -->
<section class="bg-light py-5">
  <div class="container">
    <div class="row align-items-center text-center text-md-start">
      <div class="col-12 col-md-6">
        <h1 class="display-5 fw-bold">Welcome to MyShop</h1>
        <p class="lead">
          Buy quality products at affordable prices.
        </p>
        <button class="btn btn-primary btn-lg mt-2">Shop Now</button>
      </div>

      <div class="col-12 col-md-6 text-center mt-4 mt-md-0">
        <img src="https://via.placeholder.com/400x250"
             class="img-fluid rounded"
             alt="Hero Image">
      </div>
    </div>
  </div>
</section>

<!-- ================= PRODUCT CARDS ================= -->
<section class="container my-5">
  <h2 class="text-center mb-4">Our Products</h2>

  <div class="row g-4">

    <!-- Product 1 -->
    <div class="col-12 col-md-4">
      <div class="card h-100 text-center">
        <img src="https://via.placeholder.com/300x200" class="card-img-top">
        <div class="card-body">
          <h5 class="card-title">Product One</h5>
          <p class="card-text">High quality product.</p>
          <button class="btn btn-success">Buy Now</button>
        </div>
      </div>
    </div>

    <!-- Product 2 -->
    <div class="col-12 col-md-4">
      <div class="card h-100 text-center">
        <img src="https://via.placeholder.com/300x200" class="card-img-top">
        <div class="card-body">
          <h5 class="card-title">Product Two</h5>
          <p class="card-text">Best price guaranteed.</p>
          <button class="btn btn-success">Buy Now</button>
        </div>
      </div>
    </div>

    <!-- Product 3 -->
    <div class="col-12 col-md-4">
      <div class="card h-100 text-center">
        <img src="https://via.placeholder.com/300x200" class="card-img-top">
        <div class="card-body">
          <h5 class="card-title">Product Three</h5>
          <p class="card-text">Top-rated product.</p>
          <button class="btn btn-success">Buy Now</button>
        </div>
      </div>
    </div>

  </div>
</section>

<!-- ================= LOGIN SECTION ================= -->
<section class="bg-light py-5">
  <div class="container d-flex justify-content-center">
    <div class="card p-4 shadow" style="width: 100%; max-width: 400px;">
      <h3 class="text-center mb-3">Login</h3>

      <form>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" placeholder="Enter email">
        </div>

        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" placeholder="Enter password">
        </div>

        <button class="btn btn-primary w-100">Login</button>
      </form>
    </div>
  </div>
</section>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
